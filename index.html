<title>Luma Accesorios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout (celular primero): banda rosa fija con menu + logo a la izquierda y lupa + carrito a la derecha; categorias debajo; grilla de 2 columnas sobre blanco roto; carrito y checkout a pantalla completa. */
:root {
  --bg: #FAF8F5;
  --surface: #EFEBE6;
  --fg: #2E1F26;
  --muted: #7A6A70;
  --line: #E6DFDA;
  --band: #FCDDE5;
  --band-line: #F2C2D1;
  --brand: #E6658C;
  --accent: #C2416F;
  --accent-fg: #FFFFFF;
  --err: #C2253B;
  --font-display: "Jost", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --logo: 84px;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html.lock { overflow: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; touch-action: manipulation;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--band);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Banda superior */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--band); border-bottom: 1px solid var(--band-line);
}
.bar { display: flex; align-items: center; padding-block: 6px 2px; }
.logo { display: block; line-height: 0; margin-left: 2px; }
.logo img { height: var(--logo); width: var(--logo); display: block; transition: height .2s ease, width .2s ease; }
.top.compact { --logo: 46px; }
.icon {
  position: relative; width: 48px; height: 48px; display: grid; place-items: center; flex: none;
  background: none; border: 0; padding: 0; color: var(--fg);
}
.icon.menu { margin-left: -12px; }
.icon.find { margin-left: auto; }
.icon.cart { margin-right: -12px; }
.icon svg { display: block; }
.icon .n {
  position: absolute; top: 5px; right: 3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 600; line-height: 19px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.icon .n[hidden] { display: none; }

.searchrow { display: flex; align-items: center; gap: 4px; padding-block: 4px 10px; }
.searchrow[hidden] { display: none; }
.searchrow input {
  flex: 1; min-width: 0; height: 44px; border: 1px solid var(--band-line); background: var(--bg); color: var(--fg);
  border-radius: 2px; padding: 0 14px; font-size: 16px; -webkit-appearance: none; appearance: none;
}
.searchrow input::placeholder { color: var(--muted); }
.searchrow input:focus { outline: none; border-color: var(--brand); }
.searchrow .x { flex: none; }

/* Categorias */
.cats { overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats-row { display: flex; justify-content: center; gap: 26px; width: max-content; min-width: 100%; }
.cat {
  background: none; border: 0; padding: 12px 0 10px; min-height: 44px; font-size: 15px; color: var(--fg); opacity: .72;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.cat .c { font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .8; }
.cat[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--brand); font-weight: 500; }

/* Encabezado de seccion */
.intro { padding-block: 28px 18px; display: flex; flex-direction: column; gap: 14px; }
.intro h1 {
  margin: 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(30px, 8vw, 42px);
  letter-spacing: 0.01em; line-height: 1.1; text-wrap: balance;
}
.intro p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.tools select {
  appearance: none; -webkit-appearance: none; background: transparent; border: 0; border-bottom: 1px solid var(--line);
  border-radius: 0; padding: 8px 24px 8px 2px; color: var(--fg); font-size: 16px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 9px) 55%, calc(100% - 5px) 55%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
.tools select option { background: var(--bg); color: var(--fg); }

/* Grilla */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; padding-bottom: 24px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 20px; } }
@media (min-width: 980px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .intro { flex-direction: row; align-items: end; justify-content: space-between; }
  .tools { justify-content: flex-end; }
}
.card { min-width: 0; display: flex; flex-direction: column; }
.pic {
  position: relative; aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--sw) 20%, var(--surface));
}
.pic svg { width: 56%; height: auto; color: var(--fg); }
.tag {
  position: absolute; top: 8px; left: 8px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--bg); padding: 3px 7px;
}
.meta { padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.name { font-weight: 500; font-size: 14px; line-height: 1.3; }
.var { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 22%, transparent); flex: none; }
.price { font-variant-numeric: tabular-nums; font-size: 15px; margin-top: 2px; }
.add {
  margin-top: 10px; align-self: stretch; min-height: 44px; background: transparent; border: 1px solid var(--line); padding: 10px 12px;
  font-size: 13px; letter-spacing: 0.02em; transition: background-color .15s, border-color .15s, color .15s;
}
.add:hover { border-color: var(--brand); }
.add.in { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.more { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 24px 56px; color: var(--muted); font-size: 13px; }
.empty { padding: 56px 0 88px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
footer { border-top: 1px solid var(--line); padding-block: 26px 40px; color: var(--muted); font-size: 13px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

/* Botones y enlaces */
.btn {
  background: var(--accent); color: var(--accent-fg); border: 0; padding: 14px 26px; min-height: 48px; font-size: 15px; letter-spacing: 0.02em;
  text-decoration: none; display: block; text-align: center; width: 100%;
}
.more .btn { display: inline-block; width: auto; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.btn.dark { background: var(--fg); color: #fff; }
.btn.sm { width: auto; padding: 0 20px; min-height: 48px; }
.btn[aria-disabled="true"] { opacity: .45; }
.btn:hover { filter: brightness(1.06); }
.lnk { background: none; border: 0; padding: 4px 0; color: var(--fg); text-decoration: underline; font-size: 14px; cursor: pointer; }
.lnk.center { display: block; margin: 0 auto; }
.msg { color: var(--err); font-size: 13px; margin-top: 6px; }
.msg[hidden] { display: none; }
.hint { font-size: 12.5px; color: var(--muted); }

/* Paneles laterales */
.shade { position: fixed; inset: 0; background: rgba(46,31,38,.4); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(440px, 100%);
  background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.drawer[hidden] { display: none; }
.drawer.left { right: auto; left: 0; width: min(320px, 86%); border-left: 0; border-right: 1px solid var(--line); padding-right: 0; padding-left: env(safe-area-inset-left, 0px); }
.d-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 20px; background: var(--band); border-bottom: 1px solid var(--band-line); }
.d-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: 0.12em; }
.x { background: none; border: 0; width: 44px; height: 44px; font-size: 28px; line-height: 1; padding: 0; color: var(--fg); display: grid; place-items: center; }
.d-body { flex: 1; overflow-y: auto; padding: 4px 20px 16px; min-height: 0; }
.d-foot { padding: 14px 20px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: var(--bg); }

/* Menu */
.mlist { display: flex; flex-direction: column; padding-top: 8px; }
.mitem { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; padding: 15px 0; min-height: 52px; font-size: 16px; }
.mitem .c { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.mitem[aria-current="true"] { font-weight: 500; }
.minfo { padding: 22px 0 8px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.minfo h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); }
.minfo a { color: var(--fg); }

/* Carrito */
.line { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 14px; padding: 16px 0; }
.line .pic { aspect-ratio: 1; }
.line .pic svg { width: 66%; }
.li { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lt { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.lb { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
.lp { font-weight: 600; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); }
.qty button { background: none; border: 0; width: 38px; height: 38px; font-size: 18px; }
.qty button:hover { background: var(--surface); }
.qty span { min-width: 30px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.rm { background: none; border: 0; color: var(--fg); font-size: 13px; padding: 2px 0; }
.srow2 { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 15px; }
.srow2 small { color: var(--muted); font-size: 12.5px; }
.srow2 b { font-weight: 600; font-variant-numeric: tabular-nums; }
.d-empty { padding: 48px 0; text-align: center; color: var(--muted); }

.shiptog { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 18px 0; text-align: left; font-size: 15px; min-height: 56px; }
.shiptog .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.shiptog small { color: var(--muted); font-size: 12.5px; }
.shiptog .pm { font-size: 22px; line-height: 1; color: var(--muted); }
.shipbody { padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.cprow { display: flex; gap: 8px; }
.cpin { flex: 1; min-width: 0; height: 48px; border: 1px solid var(--brand); background: transparent; padding: 0 14px; font-size: 16px; border-radius: 2px; }
.cpin:focus { outline: none; border-width: 2px; }
.cpline { font-size: 14px; }
.sh { font-size: 14px; font-weight: 600; margin-top: 6px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); padding: 12px 14px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); padding: 14px; cursor: pointer; border: 1px solid transparent; }
.opt.sel { border-color: var(--fg); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .rb { width: 20px; height: 20px; border: 1.5px solid var(--fg); border-radius: 50%; margin-top: 1px; display: grid; place-items: center; }
.opt.sel .rb::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); }
.opt input:focus-visible + .rb { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .ot { display: flex; flex-direction: column; min-width: 0; font-size: 14px; }
.opt .ot small { color: var(--muted); font-size: 12.5px; }
.opt .op { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt .op.free { color: var(--accent); }
.grp { display: flex; flex-direction: column; gap: 6px; }
.gh { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 2px 0; }
.gh span { font-variant-numeric: tabular-nums; }
.grp .opt { grid-template-columns: 22px minmax(0, 1fr); }
.pend { font-style: italic; }

.total { display: flex; justify-content: space-between; align-items: baseline; }
.total span { font-size: 18px; font-weight: 500; }
.total b { font-family: var(--font-display); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.minbox { border: 1px solid var(--band-line); border-radius: 6px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.minbox.bad { border-color: var(--err); }
.bar2 { height: 8px; border-radius: 4px; background: var(--band); overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--brand); border-radius: 4px; transition: width .25s ease; }

/* Checkout */
.co { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.co[hidden] { display: none; }
.co-band { background: var(--band); border-bottom: 1px solid var(--band-line); }
.co-bar { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
.co-bar img { height: 52px; width: 52px; display: block; }
.co-w { max-width: 560px; margin: 0 auto; }
.sumtog { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 0; min-height: 52px; font-size: 14px; }
.sumtog u { display: inline-flex; align-items: center; gap: 8px; }
.sumtog b { font-size: 17px; font-variant-numeric: tabular-nums; }
.sumbody { padding: 10px 0 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.sl { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.sl.t { font-weight: 600; padding-top: 6px; border-top: 1px solid var(--line); }
.stepper { display: flex; justify-content: space-between; position: relative; padding: 18px 0 14px; }
.stepper::before { content: ""; position: absolute; top: 34px; left: 16.6%; right: 16.6%; height: 1px; background: var(--line); }
.st { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.st i { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.st.on { color: var(--fg); }
.st.on i { border: 1.5px solid var(--fg); }
.st.done i { border-color: var(--muted); color: var(--muted); }
#co-main { padding-bottom: 56px; display: flex; flex-direction: column; gap: 14px; }
.cs { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; margin-top: 14px; }
.cs2 { font-size: 15px; font-weight: 500; margin-top: 6px; }
.fw { display: block; }
.f { display: block; border: 1px solid #8F8186; padding: 7px 14px 9px; background: transparent; border-radius: 2px; }
.f:focus-within { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.f.err { border-color: var(--err); box-shadow: none; }
.f span { display: block; font-size: 12px; color: var(--muted); }
.f input, .f select { width: 100%; border: 0; background: transparent; padding: 2px 0 0; font-size: 16px; min-height: 26px; outline: none; color: var(--fg); border-radius: 0; -webkit-appearance: none; appearance: none; }
.f select { background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.chk { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; min-height: 32px; }
.chk input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--fg); flex: none; }
.srow { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.srow > div { min-width: 0; }
.srow b { display: block; font-weight: 600; }
.srow p { color: var(--muted); overflow-wrap: anywhere; }
.srow .lnk { flex: none; }
.pay { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid transparent; padding: 14px 16px; min-height: 68px; }
.pay.sel { border-color: var(--fg); }
.pi { width: 36px; height: 30px; border: 1.5px solid var(--fg); border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.pt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 15px; font-weight: 500; }
.badge { font-style: normal; font-size: 11.5px; font-weight: 600; background: #F9B9CD; color: var(--fg); padding: 2px 9px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.paybox { background: var(--surface); border-top: 1px dashed var(--line); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; margin-top: -1px; }
.pl { font-size: 12px; color: var(--muted); }
.alias { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); padding: 8px 8px 8px 14px; }
.alias span { font-weight: 600; letter-spacing: .02em; overflow-wrap: anywhere; user-select: all; }
.alias .btn { min-height: 40px; }
.btn.mp { background: #009EE3; color: #fff; }
.notes { position: fixed; inset: 0; z-index: 70; background: rgba(46,31,38,.45); display: grid; place-items: center; padding: 16px; }
.notes[hidden] { display: none; }
.nbox { background: var(--bg); width: min(440px, 100%); }
.nhead { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 6px 20px; border-bottom: 1px solid var(--line); font-weight: 600; }
.nbody { padding: 16px 20px; }
.nbody textarea { width: 100%; min-height: 110px; border: 1px solid #8F8186; background: transparent; padding: 12px; font-size: 16px; border-radius: 2px; resize: vertical; }
.nbody textarea:focus { outline: none; border-color: var(--brand); }
.nfoot { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.nfoot button { min-height: 56px; border: 0; background: none; font-size: 15px; }
.nfoot .go { background: var(--fg); color: #fff; }
.done-h { font-family: var(--font-display); font-weight: 300; font-size: 30px; line-height: 1.15; margin-top: 18px; }
.sumcard { background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.sumcard .sl span:first-child { color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <button class="icon menu" id="open-menu" type="button" aria-label="Abrir menú" aria-expanded="false">

/* ====== UTILIDADES ====== */
var $ = function (id) { return document.getElementById(id); };

function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

var state = { cat: "todo", q: "", sort: "rank", shown: PAGE };
var cart = {};
try { var saved = JSON.parse(localStorage.getItem("luma-cart") || "{}"); Object.keys(saved).forEach(function (k) { if (BYID[k] && saved[k] > 0) cart[k] = saved[k]; }); } catch (e) {}

var co = { step: 2, detailsOpen: false, orderId: "", d: { email: "", news: false, pais: "Argentina", dni: "", nombre: "", apellido: "", tel: "", otra: false, rNombre: "", rApellido: "", dir: "", piso: "", loc: "", ref: "", nota: "", pago: null } };

/* ====== ENVIO: OPCIONES Y PRECIOS ====== */
function inBA(cp) { var n = parseInt(cp, 10); return n >= 1000 && n <= 1999; }
function shipOpt(v) {
  if (v === "mensajeria") return { id: v, kind: "mensajeria", title: "Mensajería a domicilio", detail: "En auto, CABA y GBA", price: MENSAJERIA_PRECIO };
  if (v === "local") return { id: v, kind: "local", title: LOCAL.nombre, detail: [LOCAL.direccion, LOCAL.horario].filter(Boolean).join(" · "), price: 0 };
  for (var i = 0; i < PUNTOS.length; i++) {
    if (PUNTOS[i].id === v) return { id: v, kind: "punto", title: "Punto de retiro", detail: PUNTOS[i].lugar + " (" + PUNTOS[i].barrio + ") · " + PUNTOS[i].horario, price: PUNTO_PRECIO };
  }
  return null;
}
function shipPrice() { var o = shipOpt(ship.method); return o ? o.price : 0; }
function isDelivery() { return ship.method === "mensajeria"; }

function cartItems() { return Object.keys(cart).map(function (k) { return { p: BYID[k], q: cart[k] }; }); }
function cartCount() { return cartItems().reduce(function (s, i) { return s + i.q; }, 0); }
function subtotal() { return cartItems().reduce(function (s, i) { return s + i.q * i.p.price; }, 0); }
function total() { return subtotal() + shipPrice(); }

function optHTML(ctx, v, title, sub, priceHTML, sel) {
  return '<label class="opt' + (sel ? " sel" : "") + '"><input type="radio" name="ship-' + ctx + '" value="' + v + '"' + (sel ? " checked" : "") + '><span class="rb"></span>' +
    '<span class="ot"><b style="font-weight:500">' + title + "</b>" + (sub ? "<small>" + sub + "</small>" : "") + "</span>" + (priceHTML ? '<span class="op' + (priceHTML === "Gratis" ? " free" : "") + '">' + priceHTML + "</span>" : "") + "</label>";
}
function shipHTML(ctx) {
  if (!ship.cp || ship.editing) {
    return '<form class="cpform" data-cpform novalidate><div class="cprow"><input class="cpin" inputmode="numeric" autocomplete="postal-code" maxlength="8" placeholder="Tu código postal" aria-label="Tu código postal" value="' + esc(ship.cp || "") + '">' +
      '<button class="btn ghost sm" type="submit">Calcular</button></div>' +
      (ship.cpErr ? '<p class="msg">' + ship.cpErr + "</p>" : "") +
      '<p style="margin-top:10px"><a class="lnk" href="https://www.correoargentino.com.ar/formularios/cpa" target="_blank" rel="noopener">No sé mi código postal</a></p></form>';
  }
  var h = '<p class="cpline">Entregas para el CP: <b>' + esc(ship.cp) + '</b>. <button type="button" class="lnk" data-cpchange>Cambiar CP</button></p>';

  if (inBA(ship.cp)) {
    h += optHTML(ctx, "mensajeria", "Mensajería", "En auto, CABA y GBA. Coordinamos día y franja horaria por WhatsApp.", money(MENSAJERIA_PRECIO), ship.method === "mensajeria");
  } else {
    h += '<p class="note">Por ahora la mensajería llega solo a CABA y GBA. Podés retirar tu pedido en el local o en un punto de retiro.</p>';
  }
  h += '<h3 class="sh">Retirar por</h3>';
  var loc = shipOpt("local");
  h += optHTML(ctx, "local", esc(loc.title), loc.detail ? esc(loc.detail) : '<span class="pend">Dirección y horario a definir</span>', "Gratis", ship.method === "local");

/* ====== GRILLA ====== */
function visible() {
  var list = PRODUCTS.filter(function (p) { return state.cat === "todo" || p.cat === state.cat; });
  if (state.q) {
    var t = norm(state.q).split(/\s+/).filter(Boolean);
    list = list.filter(function (p) {
      var hay = norm(p.name + " " + p.variant + " " + CATS[p.ci].label);
      return t.every(function (w) { return hay.indexOf(w) !== -1; });
    });
  }
  var by = {
    rank: function (a, b) { return a.rank - b.rank || a.ci - b.ci; },
    asc: function (a, b) { return a.price - b.price || a.id - b.id; },
    desc: function (a, b) { return b.price - a.price || a.id - b.id; },
    az: function (a, b) { return a.name.localeCompare(b.name, "es") || a.id - b.id; }
  };
  return list.sort(by[state.sort]);
}
function cardHTML(p) {
  var q = cart[p.id] || 0;
  return '<article class="card" style="--sw:' + SW[p.variant] + '">' +
    '<div class="pic">' + (p.isNew ? '<span class="tag">Nuevo</span>' : "") + glyph(p.cat, SW[p.variant]) + "</div>" +

}
function renderGrid() {

  $("sub").textContent = state.q ? "Productos que coinciden con tu búsqueda." : c ? c.sub : "Accesorios y bijouterie. Elegí lo que te gusta, armá el carrito y mandanos el pedido por WhatsApp.";
  $("count").textContent = list.length + (list.length === 1 ? " producto" : " productos");

    fld("nombre", "Nombre", { ac: "given-name" }) + fld("apellido", "Apellido", { ac: "family-name" }) + fld("tel", "Teléfono", { type: "tel", ac: "tel", im: "tel" });
  h += '<label class="chk"><input type="checkbox" data-k="otra" id="otra-chk"' + (d.otra ? " checked" : "") + '><span id="otra-lbl"></span></label>';
  h += '<div id="otra-box" hidden><h3 class="cs2" id="otra-h"></h3><div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">' + fld("rNombre", "Nombre") + fld("rApellido", "Apellido") + "</div></div>";
  h += '<button class="btn dark" id="to-pay" type="button" style="margin-top:8px">Continuar con el pago</button>';
  return h;
}

function updateCoDynamic() {
  if (!$("addr")) return;
  var del = isDelivery();
  $("addr").hidden = !del;
  $("otra-lbl").textContent = "Otra persona va a " + (del ? "recibir" : "retirar") + " el pedido";
  $("otra-h").textContent = "Persona que " + (del ? "recibe" : "retira");
  $("otra-box").hidden = !co.d.otra;
}

function setErr(k, on, text) {
  var w = $("w-" + k), m = $("m-" + k);
  if (w) w.classList.toggle("err", !!on);
  if (m) { m.hidden = !on; if (on && text) m.textContent = text; }
}
function validate() {
  var d = co.d, bad = [];
  function chk(k, ok, text) { setErr(k, !ok, text); if (!ok) bad.push(k); }
  function filled(v) { return String(v).trim().length > 0; }
  var FILL = "Este campo debería estar completo";
  chk("email", /^\S+@\S+\.\S+$/.test(d.email.trim()), d.email.trim() ? "Ingresá un e-mail válido" : FILL);
  var dn = d.dni.replace(/[.\-\s]/g, "");
  chk("dni", /^\d{7,11}$/.test(dn), dn ? "Ingresá un DNI o CUIT válido, solo números" : FILL);
  chk("nombre", filled(d.nombre), FILL); chk("apellido", filled(d.apellido), FILL);
  chk("tel", d.tel.replace(/\D/g, "").length >= 8, d.tel.trim() ? "Ingresá un teléfono válido" : FILL);
  if (isDelivery()) { chk("dir", filled(d.dir), FILL); chk("loc", filled(d.loc), FILL); }
  if (d.otra) { chk("rNombre", filled(d.rNombre), FILL); chk("rApellido", filled(d.rApellido), FILL); }
  var shipBad = !ship.method;
  $("m-ship").hidden = !shipBad;
  var first = null;
  if (bad.length) first = $("f-" + bad[0]);
  if (shipBad && (!first || $("co-ship").getBoundingClientRect().top < first.getBoundingClientRect().top)) first = $("co-ship");
  return { ok: !bad.length && !shipBad, first: first };
}

function who() {
  var d = co.d;
  return d.otra ? (d.rNombre + " " + d.rApellido).trim() : (d.nombre + " " + d.apellido).trim();
}
function shipLabel() {
  var o = shipOpt(ship.method); if (!o) return "";
  var d = co.d, t = o.title;
  if (o.kind === "mensajeria") t += " · " + [d.dir, d.piso, d.loc].filter(function (x) { return String(x).trim(); }).join(", ") + " (CP " + ship.cp + ")";
  else if (o.detail) t += " · " + o.detail;
  return t + " · " + (o.price ? money(o.price) : "Gratis");
}

function step3HTML() {
  var d = co.d, del = isDelivery();
  function row(t, p, key) { return '<div class="srow"><div><b>' + t + "</b><p>" + p + '</p></div><button class="lnk" type="button" data-edit="' + key + '">Cambiar</button></div>'; }
  return row("Contacto", esc(d.email), "email") +
    row("Entrega", esc(shipLabel()), "ship") +
    row("Datos de facturación", esc((d.nombre + " " + d.apellido).trim()) + " · " + esc(d.dni) + " · " + esc(d.tel), "dni") +
    row("Persona que " + (del ? "recibe" : "retira") + " el pedido", esc(who()), "who") +
    '<div class="srow"><div><b>Notas de pedido</b><p id="note-p">' + esc(d.nota) + '</p></div><button class="lnk" type="button" id="note-btn">' + (d.nota ? "Editar" : "Agregar") + "</button></div>" +
    '<h2 class="cs">Medio de pago</h2><div id="pay-region"></div><p class="msg" id="m-pay" hidden>Elegí un medio de pago.</p>' +
    '<button class="btn dark" id="place" type="button" style="margin-top:8px">Realizar pedido</button>';
}

function renderPayRegion() {
  var t = money(total()), sel = co.d.pago;
  function payRow(id, title) {
    return '<button type="button" class="pay' + (sel === id ? " sel" : "") + '" data-pay="' + id + '" aria-pressed="' + (sel === id) + '"><span class="pi">$</span><span class="pt">' + title + '<em class="badge">Pagás ' + t + "</em></span>" + ICON_CHEV + "</button>";
  }
  var h = payRow("transferencia", "Transferencia o depósito bancario");
  if (sel === "transferencia") {
    h += '<div class="paybox"><div><p class="pl">Alias</p><div class="alias"><span id="alias-v">' + esc(ALIAS) + '</span><button type="button" class="btn ghost sm" data-copy>Copiar</button></div></div>' +
      '<a class="btn mp" href="' + esc(MP_LINK) + '" target="_blank" rel="noopener">Pagar con Mercado Pago</a>' +
      '<p class="hint">Pagá con el alias desde tu banco o con Mercado Pago. Después tocá Realizar pedido y mandanos el comprobante por WhatsApp.</p></div>';
  }
  h += '<div style="height:10px"></div>' + payRow("efectivo", "Efectivo");
  if (sel === "efectivo") {
    h += '<div class="paybox"><p class="hint" style="font-size:14px;color:var(--fg)">Pagás en efectivo al ' + (isDelivery() ? "recibir" : "retirar") + " tu pedido.</p></div>";
  }
  $("pay-region").innerHTML = h;
}

function copyAlias(btn) {
  var back = function () { setTimeout(function () { btn.textContent = "Copiar"; }, 1800); };
  var ok = function () { btn.textContent = "Copiado"; back(); };
  var fail = function () {
    try { var r = document.createRange(); r.selectNodeContents($("alias-v")); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    btn.textContent = "Seleccionado"; back();
  };
  try { navigator.clipboard.writeText(ALIAS).then(ok, fail); } catch (e) { fail(); }
}

function orderText() {
  var d = co.d, o = shipOpt(ship.method), L = [];
  L.push("Hola! Quiero confirmar este pedido en " + TIENDA + ".", "Pedido: " + co.orderId, "", "PRODUCTOS");
  cartItems().forEach(function (i) { L.push(i.q + " x " + i.p.name + " (" + i.p.variant + ") - " + money(i.q * i.p.price)); });
  L.push("", "Subtotal: " + money(subtotal()), "Entrega: " + shipLabel(), "TOTAL: " + money(total()), "",
    "Pago: " + (d.pago === "transferencia" ? "Transferencia o depósito bancario (alias " + ALIAS + ")" : "Efectivo"), "",
    "DATOS", "Nombre: " + (d.nombre + " " + d.apellido).trim(), "Teléfono: " + d.tel, "E-mail: " + d.email, "DNI o CUIT: " + d.dni);
  L.push((isDelivery() ? "Recibe: " : "Retira: ") + who());
  if (isDelivery() && d.ref.trim()) L.push("Referencias: " + d.ref.trim());
  if (d.nota.trim()) L.push("", "Nota: " + d.nota.trim());
  if (d.pago === "transferencia") L.push("", "Te mando el comprobante de pago por acá.");
  return L.join("\n");
}
function waURL() { return "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(orderText()); }

function step4HTML() {
  var d = co.d;
  return '<h2 class="done-h">Tu pedido está armado</h2>' +
    '<p>Número de pedido: <b>' + esc(co.orderId) + "</b></p>" +
    "<p>Falta un último paso: mandanos el pedido por WhatsApp para que lo confirmemos con vos." + (d.pago === "transferencia" ? " Acordate de adjuntar el comprobante de pago." : "") + "</p>" +
    '<div class="sumcard"><div class="sl"><span>Productos</span><span>' + cartCount() + "</span></div>" +
    '<div class="sl"><span>Entrega</span><span style="text-align:right">' + esc(shipOpt(ship.method).title) + "</span></div>" +
    '<div class="sl"><span>Pago</span><span>' + (d.pago === "transferencia" ? "Transferencia" : "Efectivo") + "</span></div>" +
    '<div class="sl t"><span>Total</span><span>' + money(total()) + "</span></div></div>" +
    '<a class="btn" id="wa-send" href="' + waURL() + '" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>' +
    '<button class="btn ghost" type="button" id="finish">Ya lo envié</button>' +
    '<button class="lnk center" type="button" id="edit-order">Volver a editar el pedido</button>';
}

/* Notas de pedido */
function openNotes() { $("notes-t").value = co.d.nota; $("notes").hidden = false; updateLock(); $("notes-t").focus(); }
function closeNotes() { $("notes").hidden = true; updateLock(); }

/* ====== EVENTOS ====== */
function goStep(n, targetId) {
  co.step = n; renderCo(); $("co").scrollTop = 0;
  if (targetId) { var t = $(targetId); if (t) { t.scrollIntoView({ block: "center" }); if (t.focus && t.tagName === "INPUT") t.focus(); } }
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a");
  if (!t) return;
  var ds = t.dataset;
  if (ds.cat) { setCat(ds.cat); }
  else if (ds.menucat) { closeMenu(); setCat(ds.menucat); window.scrollTo(0, 0); }
  else if (ds.add) { change(ds.add, 1); }
  else if (ds.inc) { change(ds.inc, 1); }
  else if (ds.dec) { change(ds.dec, -1); }
  else if (ds.rm) { change(ds.rm, -(cart[ds.rm] || 0)); }
  else if (ds.shiptog !== undefined) { ship.open = !ship.open; renderShipPanel(); }
  else if (ds.cpchange !== undefined) { ship.editing = true; ship.cpErr = ""; refreshShip(); var ci = document.querySelector(".cpin"); if (ci) ci.focus(); }
  else if (ds.pay) { co.d.pago = ds.pay; $("m-pay").hidden = true; renderPayRegion(); }
  else if (ds.copy !== undefined) { copyAlias(t); }
  else if (ds.edit) { goStep(2, ds.edit === "ship" ? "co-ship" : ds.edit === "who" ? (co.d.otra ? "f-rNombre" : "f-nombre") : "f-" + ds.edit); }
  else if (t.id === "more-btn") { state.shown += PAGE; renderGrid(); }
  else if (t.id === "open-cart") { openCart(); }
  else if (t.id === "close-cart" || t.id === "keep") { closeCart(); }
  else if (t.id === "open-menu") { openMenu(); }
  else if (t.id === "close-menu") { closeMenu(); $("open-menu").focus(); }
  else if (t.id === "open-search") { if ($("searchrow").hidden) openSearch(); else closeSearch(); }
  else if (t.id === "close-search") { closeSearch(); $("open-search").focus(); }
  else if (t.id === "start") {
    var sub = subtotal();
    if (sub < MIN_COMPRA) { ship.minErr = true; renderFoot(); return; }
    if (!ship.method) { ship.open = true; ship.attempt = true; renderShipPanel(); var s = $("d-ship"); if (s && s.scrollIntoView) s.scrollIntoView({ block: "center" }); return; }
    openCheckout();
  }
  else if (t.id === "co-back") { if (co.step === 2) closeCheckout(true); else if (co.step === 3) goStep(2); else goStep(3); }
  else if (t.id === "sumtog") { co.detailsOpen = !co.detailsOpen; renderSummary(); }
  else if (t.id === "to-pay") {
    var v = validate();
    if (!v.ok) { if (v.first) { v.first.scrollIntoView({ block: "center", behavior: "smooth" }); if (v.first.focus && v.first.tagName === "INPUT") v.first.focus({ preventScroll: true }); } return; }
    goStep(3);
  }
  else if (t.id === "note-btn") { openNotes(); }
  else if (t.id === "notes-x" || t.id === "notes-cancel") { closeNotes(); }
  else if (t.id === "notes-save") {
    co.d.nota = $("notes-t").value.trim(); closeNotes();
    if ($("note-p")) { $("note-p").textContent = co.d.nota; $("note-btn").textContent = co.d.nota ? "Editar" : "Agregar"; }
  }
  else if (t.id === "place") {
    if (!co.d.pago) { $("m-pay").hidden = false; return; }
    co.orderId = "LU-" + Date.now().toString(36).slice(-5).toUpperCase();
    goStep(4);
  }
  else if (t.id === "edit-order") { goStep(3); }
  else if (t.id === "finish") { cart = {}; saveCart(); co.d.pago = null; co.d.nota = ""; ship.method = null; ship.open = false; closeCheckout(false); renderCart(); renderGrid(); window.scrollTo(0, 0); }
});

document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.name && el.name.indexOf("ship-") === 0) setMethod(el.value);
});
document.addEventListener("input", function (e) {
  var el = e.target, k = el.dataset && el.dataset.k;
  if (!k) return;
  co.d[k] = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "checkbox") { if (k === "otra") updateCoDynamic(); }
  else setErr(k, false);
});
document.addEventListener("submit", function (e) {
  if (e.target.hasAttribute && e.target.hasAttribute("data-cpform")) { e.preventDefault(); submitCP(e.target); }
});
$("shade").addEventListener("click", function () { if (!$("drawer").hidden) closeCart(); if (!$("menu").hidden) closeMenu(); });
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!$("notes").hidden) closeNotes();
  else if (!$("co").hidden) { if (co.step === 2) closeCheckout(true); else goStep(co.step - 1); }
  else if (!$("drawer").hidden) closeCart();
  else if (!$("menu").hidden) { closeMenu(); $("open-menu").focus(); }
  else if (!$("searchrow").hidden) { closeSearch(); $("open-search").focus(); }
});
$("searchrow").addEventListener("submit", function (e) { e.preventDefault(); $("q").blur(); });
$("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); state.shown = PAGE; renderGrid(); });
$("sort").addEventListener("change", function (e) { state.sort = e.target.value; state.shown = PAGE; renderGrid(); });

/* Logo mas chico al bajar (con margen para que no titile) */
(function () {
  var top = $("top"), ticking = false;
  function upd() {
    var y = window.scrollY || 0;
    if (y > 90) top.classList.add("compact");
    else if (y < 12) top.classList.remove("compact");
    ticking = false;
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive: true });
})();

function setCat(id, fromHash) {
  state.cat = id; state.shown = PAGE;
  renderCats(); renderGrid();
  if (!fromHash && location.hash !== "#" + id) { location.hash = id; }
}
window.addEventListener("hashchange", function () {
  var h = location.hash.replace("#", "");
  var ok = h === "todo" || CATS.some(function (c) { return c.id === h; });
  if (ok && h !== state.cat) setCat(h, true);
});

(function init() {
  var src = $("logo-img").src;
  Array.prototype.forEach.call(document.querySelectorAll("img[data-logo]"), function (im) { im.src = src; });
  var h = location.hash.replace("#", "");
  if (h && (h === "todo" || CATS.some(function (c) { return c.id === h; }))) state.cat = h;
  renderCats(); renderGrid(); renderCart();
})();
</script>
